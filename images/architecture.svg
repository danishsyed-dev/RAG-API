<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400">
  <style>
    .box{fill:#f6f8fa;stroke:#4b5563;stroke-width:1.5;rx:8;}
    .text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#0f172a}
  </style>
  <rect x="30" y="50" width="200" height="80" class="box"/>
  <text x="130" y="95" text-anchor="middle" class="text">Ingestion</text>
  <text x="130" y="115" text-anchor="middle" class="text">`embed.py`</text>

  <rect x="300" y="50" width="200" height="80" class="box"/>
  <text x="400" y="95" text-anchor="middle" class="text">Vector Store</text>
  <text x="400" y="115" text-anchor="middle" class="text">ChromaDB (`./db`)</text>

  <rect x="570" y="50" width="200" height="80" class="box"/>
  <text x="670" y="95" text-anchor="middle" class="text">API</text>
  <text x="670" y="115" text-anchor="middle" class="text">FastAPI (`app.py`)</text>

  <rect x="840" y="50" width="120" height="80" class="box"/>
  <text x="900" y="95" text-anchor="middle" class="text">LLM</text>
  <text x="900" y="115" text-anchor="middle" class="text">Ollama / TinyLlama</text>

  <line x1="230" y1="90" x2="300" y2="90" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)" />
  <line x1="500" y1="90" x2="570" y2="90" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)" />
  <line x1="770" y1="90" x2="840" y2="90" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)" />

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/>
    </marker>
  </defs>

  <text x="130" y="180" class="text">Developer local stack — ingest, index, query, synthesize.</text>
</svg>